name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF2D2D&color_dots=#ebedf0,#ffc9c9,#ff8a8a,#ff4d4d,#d40000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF2D2D&color_dots=#161b22,#4a0d0d,#8f1a1a,#d42424,#ff2d2d

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
